<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a5f4e" />
    <!--
      Tema antes da primeira pintura: sem isto a página piscaria no Smeargle até o JS carregar.
      Ids e cores do header repetem src/theme (themes.js e themes.css); o teste themes.test.js confere.
    -->
    <script>
      (function () {
        var THEMES = ['smeargle', 'wailord', 'empoleon', 'groudon', 'zoroark', 'chandelure'];
        var HEADERS = { smeargle: '#7a5f4e', wailord: '#4d78b2', empoleon: '#223256', groudon: '#2a1915', zoroark: '#222028', chandelure: '#1d1823' };
        var theme = 'smeargle';
        try {
          var saved = window.localStorage.getItem('smearglepedia-theme');
          if (THEMES.indexOf(saved) !== -1) theme = saved;
        } catch (error) {
          // Sem armazenamento (modo privado, bloqueio): fica o padrão.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', HEADERS[theme]);
      })();
    </script>
    <meta
      name="description"
      content="Pokédex Competitiva - Estatísticas de uso da Smogon e dados oficiais da PokeAPI"
    />
    <title>Smearglepedia</title>
    <link rel="canonical" href="https://smearglepediaa.netlify.app/" />
    <!-- Prévia do link no WhatsApp, Discord e redes sociais. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Smearglepedia" />
    <meta property="og:title" content="Smearglepedia · guia de campo competitivo" />
    <meta
      property="og:description"
      content="Pokédex com dados da PokeAPI, estatísticas da Smogon, montagem de times, calculadora de dano e os treinadores da Liga."
    />
    <meta property="og:url" content="https://smearglepediaa.netlify.app/" />
    <meta property="og:image" content="https://smearglepediaa.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Smearglepedia com o Smeargle em um medalhão de papel" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- As fontes não bloqueiam a primeira pintura: com display=swap o texto já aparece na fonte de reserva. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,500;1,600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,500;1,600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
