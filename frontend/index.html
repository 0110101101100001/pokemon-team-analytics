<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a5f4e" />
    <!--
      Tema antes da primeira pintura: sem isto a página piscaria no Smeargle até o JS carregar.
      Ids e cores do header repetem src/theme (themes.js e themes.css); o teste themes.test.js confere.
    -->
    <script>
      (function () {
        var THEMES = ['smeargle', 'wailord', 'empoleon', 'groudon', 'zoroark', 'chandelure', 'serperior', 'pikachu', 'sylveon', 'haxorus', 'heracross', 'darkrai', 'aggron', 'ninetales-shiny', 'staraptor', 'maushold'];
        var HEADERS = {
          smeargle: '#7a5f4e', wailord: '#4d78b2', empoleon: '#223256', groudon: '#2a1915', zoroark: '#222028', chandelure: '#1d1823',
          serperior: '#2f6b39', pikachu: '#f4d445', sylveon: '#f3c6d6', haxorus: '#221f14', heracross: '#1a2238', darkrai: '#231a2f',
          aggron: '#1c1e21', 'ninetales-shiny': '#22212b', staraptor: '#4a4a52', maushold: '#e9e2df'
        };
        var theme = 'smeargle';
        try {
          var saved = window.localStorage.getItem('smearglepedia-theme');
          if (THEMES.indexOf(saved) !== -1) theme = saved;
        } catch (error) {
          // Sem armazenamento (modo privado, bloqueio): fica o padrão.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', HEADERS[theme]);
      })();
    </script>
    <meta
      name="description"
      content="Pokédex Competitiva - Estatísticas de uso da Smogon e dados oficiais da PokeAPI"
    />
    <title>Smearglepedia</title>
    <link rel="canonical" href="https://smearglepediaa.netlify.app/" />
    <!-- Prévia do link no WhatsApp, Discord e redes sociais. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Smearglepedia" />
    <meta property="og:title" content="Smearglepedia · guia de campo competitivo" />
    <meta
      property="og:description"
      content="Pokédex com dados da PokeAPI, estatísticas da Smogon, montagem de times, calculadora de dano e os treinadores da Liga."
    />
    <meta property="og:url" content="https://smearglepediaa.netlify.app/" />
    <!-- O ?v= força as redes a buscar a imagem de novo: incremente a cada troca do og.png. -->
    <meta property="og:image" content="https://smearglepediaa.netlify.app/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smearglepedia · guia de campo competitivo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://smearglepediaa.netlify.app/og.png?v=2" />
    <!-- Sprites e artes vêm do jsDelivr: a conexão (DNS + TLS) abre enquanto o JS carrega. Sem crossorigin: as
         imagens não usam CORS, e uma conexão aberta em modo CORS não seria reaproveitada por elas. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
