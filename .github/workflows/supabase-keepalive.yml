name: Supabase keep-alive

# O plano gratuito pausa o projeto após uma semana sem atividade. Uma leitura diária de uma linha
# da PokemonTrainers com a chave anon (a mesma do site) basta para mantê-lo ativo.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PING_TABLE: PokemonTrainers
