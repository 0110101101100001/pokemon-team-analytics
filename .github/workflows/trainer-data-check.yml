name: Dados da Liga

# A tabela PokemonTrainers muda direto no Supabase, sem push: uma vez por semana o teste confere se o front
# conhece todas as regiões, papéis, etapas, mecânicas e jogos dela.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Conferir a tabela PokemonTrainers
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Os secrets SUPABASE_URL e SUPABASE_ANON_KEY precisam estar definidos no repositório. SUPABASE_ANON_KEY é a chave anon (a mesma VITE_SUPABASE_ANON_KEY do Netlify), não a service role."
            exit 1
          fi
          npx vitest run src/utils/trainers-data.test.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
