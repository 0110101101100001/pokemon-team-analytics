name: Manter o repositório ativo

# O GitHub desativa workflows agendados após 60 dias sem atividade no repositório.
# Um commit vazio por mês mantém os agendamentos (keep-alive, sincronização da Smogon) ligados.
# Mensal, e não bimestral: entre 1º de julho e 1º de setembro passam 62 dias.
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-active
  cancel-in-progress: false

jobs:
  empty-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit vazio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: mantém o repositório ativo [skip ci]"
          git push
