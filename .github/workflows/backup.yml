name: Backup semanal do banco de dados

# Cópia de PokemonTrainers e smogon_stats em backups/, pela API REST com a chave service_role,
# com commit só quando os dados mudam. Como restaurar: ver "Backup e restauração" no README.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Exportar as tabelas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/backup-supabase.mjs backups

      # O script grava sempre os mesmos bytes para os mesmos dados: sem mudança, não há commit.
      - name: Commit se houver diferença
        run: |
          git add backups
          if git diff --cached --quiet; then
            echo "Nada mudou desde o último backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(backup): cópia semanal do banco de dados [skip ci]"
          git push
